<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MATLAB & Python – Vergleich mit Syntaxhighlighting</title>

    <!-- Highlight.js CSS (Theme mit MATLAB-Vibe, z.B. "github") -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <!-- Highlight.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Sprachen: MATLAB & Python -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/matlab.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f0f0f0;
            font-family: sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            border-right: 1px solid #ccc;
        }
        .panel:last-child {
            border-right: none;
        }
        h2 {
            margin-top: 0;
        }
        pre {
            margin: 0;
        }
        code {
            font-family: "Fira Code", "JetBrains Mono", monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MATLAB links -->
    <div class="panel">
        <h2>MATLAB – AbflachungSonne.m</h2>
        <pre><code id="matlab" class="language-matlab">Lade MATLAB‑Code…</code></pre>
    </div>

    <!-- Python rechts -->
    <div class="panel">
        <h2>Python – AbflachungSonne.py</h2>
        <pre><code id="python" class="language-python">Lade Python‑Code…</code></pre>
    </div>
</div>

<script>
function loadAndHighlight(id, url) {
    fetch(url)
        .then(r => r.text())
        .then(t => {
            const el = document.getElementById(id);
            el.textContent = t;
            hljs.highlightElement(el);
        })
        .catch(err => {
            document.getElementById(id).textContent = "Fehler beim Laden.";
            console.error(err);
        });
}

loadAndHighlight(
    "matlab",
    "https://raw.githubusercontent.com/sn-code-inside/fingeruebungen-physik/main/hm/AbflachungSonne.m"
);

loadAndHighlight(
    "python",
    "https://raw.githubusercontent.com/sn-code-inside/fingeruebungen-physik/main/python/hm/AbflachungSonne.py"
);
</script>

</body>
</html>
